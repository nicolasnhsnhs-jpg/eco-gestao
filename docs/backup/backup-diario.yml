# Backup diário do banco de dados do Eco Gestão.
#
# ATENÇÃO: este arquivo NÃO roda neste repositório (que é público).
# Ele deve ser copiado para um repositório PRIVADO separado, em
# .github/workflows/backup-diario.yml. Veja docs/BACKUP.md.

name: Backup diário

on:
  schedule:
    - cron: '0 6 * * *' # todo dia às 03:00 (horário de Brasília)
  workflow_dispatch: # permite rodar na hora, pelo botão "Run workflow"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar o cliente do PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Exportar o banco
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          arquivo="eco-gestao-$(date -u +%Y-%m-%d).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=privado \
            --file="$arquivo"
          echo "ARQUIVO=$arquivo" >> "$GITHUB_ENV"
          ls -lh "$arquivo"

      - name: Criptografar
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_SENHA" --output "$ARQUIVO.gpg" "$ARQUIVO"
          rm "$ARQUIVO"

      - name: Guardar o backup (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARQUIVO }}
          path: ${{ env.ARQUIVO }}.gpg
          retention-days: 90
          if-no-files-found: error
